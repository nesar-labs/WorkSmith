    async function saveWorkerDashboard(){const profile={businessName:document.getElementById('worker-business-name').value,specialty:document.getElementById('worker-specialty').value,bio:document.getElementById('worker-bio').value,experience:document.getElementById('worker-experience').value,serviceLocation:document.getElementById('worker-service-location').value,rate:Number(document.getElementById('worker-rate').value),rateType:document.getElementById('worker-rate-type').value,portfolio:currentUser.workerProfile?.portfolio||[]};const date=document.getElementById('worker-date').value;const slots=[...document.querySelectorAll('[data-slot]:checked')].map(x=>x.value);const availability={...(currentUser.availability||{}),[date]:slots};const summary=[profile.businessName||currentUser.name,profile.specialty||'Service not set',profile.serviceLocation||'Public service area not set',profile.experience||'Experience not set','INR '+(profile.rate||0)+' / '+profile.rateType,slots.length+' open slots on '+date].join('\n');if(!window.confirm('Review your profile changes before saving:\n\n'+summary+'\n\nSave these changes?'))return;try{const r=await fetch('/api/me/worker-profile',{method:'PATCH',headers:{'Content-Type':'application/json','Authorization':'Bearer '+db.authToken},body:JSON.stringify({profile,availability})});const d=await r.json();if(!r.ok)throw Error(d.message);currentUser=d.user;saveStore();toast('Your worker profile and availability are saved.');}catch(e){toast(e.message||'Could not save profile.','error')}}
    async function renderWorkerDashboard(){const profile=currentUser.workerProfile||{},slots=['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00'];const workspace=document.getElementById('workspace-view');if(!workspace)return;workspace.innerHTML=`<main class="min-h-screen bg-[#f4f7fb] p-4 sm:p-8"><section class="mx-auto max-w-4xl"><header class="mb-7 flex items-center justify-between"><div><p class="text-xs font-bold uppercase tracking-widest text-blue-600">Worker dashboard</p><h1 class="mt-1 text-3xl font-extrabold">Welcome, ${escapeHtml(currentUser.name)}</h1></div><button id="worker-logout" class="rounded-xl border bg-white px-4 py-2 text-sm font-bold">Sign out</button></header><div class="grid gap-5 lg:grid-cols-[1.1fr,.9fr]"><form id="worker-form" class="space-y-4 rounded-3xl border bg-white p-6 shadow-sm"><div class="flex items-center justify-between"><h2 class="text-xl font-extrabold">Your service profile</h2><span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-bold text-slate-600">Editable profile</span></div><label class="block text-sm font-semibold">Business / professional name<input id="worker-business-name" value="${escapeHtml(profile.businessName||'')}" class="mt-2 w-full rounded-xl border p-3" placeholder="Optional"></label><label class="block text-sm font-semibold">Service / specialty<input id="worker-specialty" required value="${escapeHtml(profile.specialty||'')}" placeholder="e.g. Electrician" class="mt-2 w-full rounded-xl border p-3"></label><label class="block text-sm font-semibold">About your work<textarea id="worker-bio" rows="3" class="mt-2 w-full rounded-xl border p-3">${escapeHtml(profile.bio||'')}</textarea></label><label class="block text-sm font-semibold">Experience / skills<textarea id="worker-experience" rows="2" maxlength="500" class="mt-2 w-full rounded-xl border p-3" placeholder="Years of experience, skills, and services">${escapeHtml(profile.experience||'')}</textarea></label><label class="block text-sm font-semi py-3 font-bold text-blue-700">Save open slots</button><h3 class="mt-8 font-extrabold">Booking requests</h3><div id="worker-bookings" class="mt-3 space-y-2 text-sm text-slate-500">Loading…</div></section></div></section></main>`;document.getElementById('worker-logout').onclick=()=>{db.authToken=null;db.session=null;currentUser=null;saveStore();renderAuth()};const refreshSlots=()=>{const open=currentUser.availability?.[document.getElementById('worker-date').value]||[];document.querySelectorAll('[data-slot]').forEach(x=>x.checked=open.includes(x.value))};document.getElementById('worker-date').onchange=refreshSlots;refreshSlots();document.getElementById('worker-form').onsubmit=e=>{e.preventDefault();saveWorkerDashboard()};document.getElementById('save-availability').onclick=saveWorkerDashboard;document.getElementById('worker-photos').onchange=async e=>{const images=[];for(const file of [...e.target.files].slice(0,8)){if(file.size>900000){toast('Each portfolio photo must be under 900 KB.','error');continue}images.push(await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(file)}))}currentUser.workerProfile={...(currentUser.workerProfile||{}),portfolio:[...(currentUser.workerProfile?.portfolio||[]),...images].slice(0,12)};document.getElementById('worker-gallery').innerHTML=currentUser.workerProfile.portfolio.map(src=>`<img src="${src}" class="h-16 w-16 rounded-xl object-cover">`).join('')};try{const d=await requestJson('/api/me/appointments',{headers:{Authorization:'Bearer '+db.authToken}});document.getElementById('worker-bookings').innerHTML=d.appointments.map(a=>`<article class="rounded-xl border p-3"><div class="flex flex-wrap items-start justify-between gap-2"><div><b>${escapeHtml(a.customerName)}</b> · ${escapeHtml(a.date)} ${escapeHtml(a.time)}<p>${escapeHtml(a.professional.specialty)}</p><p class="mt-1 text-sm font-semibold text-slate-700">Service address: ${escapeHtml(a.serviceAddress||a.city||'Address not provided')}</p><span class="text-xs">${escapeHtml(a.notification?.message||'')}</span></div><span class="rounded-full px-3 py-1 text-xs font-bold ${String(a.status).toLowerCase()==='confirmed'?'bg-emerald-50 text-emerald-700':String(a.status).toLowerCase()==='rejected'?'bg-rose-50 text-rose-700':'bg-amber-50 text-amber-700'}">${escapeHtml(a.status)}</span></div>${a.status==='pending'?`<div class="mt-3 flex gap-2"><button data-booking-action="${a.id}" data-status="Confirmed" class="rounded-lg bg-emerald-600 px-3 py-2 text-xs font-bold text-white">Confirm</button><button data-booking-action="${a.id}" data-status="Rejected" class="rounded-lg bg-rose-600 px-3 py-2 text-xs font-bold text-white">Reject</button></div>`:''}</article>`).join('')||'No booking requests yet.';document.querySelectorAll('[data-booking-action]').forEach(button=>button.onclick=async()=>{button.disabled=true;try{const response=await fetch('/api/appointments/'+encodeURIComponent(button.dataset.bookingAction)+'/status',{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+db.authToken},body:JSON.stringify({status:button.dataset.status})});if(!response.ok){const responseText=await response.text().catch(()=> '');let message='The server could not update this booking. Please try again.';try{const errorData=JSON.parse(responseText);message=errorData.message||message}catch{}throw Error(message)}const contentType=response.headers.get('content-type')||'';if(!contentType.toLowerCase().includes('application/json'))throw Error('The server returned an unexpected response. Restart WorkSmith and try again.');const result=await response.json().catch(()=>null);if(!result?.success)throw Error(result?.message||'The server returned an invalid booking response.');toast('Booking '+String(result.appointment?.status||button.dataset.status).toLowerCase()+'.');renderWorkerDashboard()}catch(error){toast(error.message||'Could not update booking.','error');button.disabled=false}})}catch{document.getElementById('worker-bookings').textContent='Could not load booking requests.'}}


    async function loadWorkerDirectory(){try{const data=await requestJson('/api/workers',{headers:{Authorization:'Bearer '+db.authToken}});const footer=document.querySelector('main footer');if(!footer)return;let section=document.getElementById('worker-directory');if(!section){section=document.createElement('section');section.id='worker-directory';section.className='my-8';footer.before(section)}const workers=data.workers||[];registeredWorkers=workers;registeredDirectoryLoaded=true;section.innerHTML=`<div class="mb-4 flex flex-wrap items-center justify-between gap-3"><div><h2 class="text-xl font-extrabold">WorkSmith providers</h2><p class="mt-1 text-sm text-slate-500">Compare local providers and book an open slot.</p></div><button id="compare-workers" class="rounded-xl border bg-white px-4 py-2 text-sm font-bold">Compare selected (0)</button></div><div class="grid gap-3 md:grid-cols-2 xl:grid-cols-3">${workers.map(w=>`<article data-worker-card="${w.id}" data-specialty="${escapeHtml(w.profile.specialty||'')}" class="rounded-2xl border bg-white p-4 shadow-sm"><div class="flex justify-between"><div class="flex gap-3">${w.profilePhoto?`<img src="${escapeHtml(w.profilePhoto)}" alt="" class="h-12 w-12 rounded-xl object-cover">`:''}<div><h3 class="font-extrabold">${escapeHtml(w.profile.businessName||w.name)}</h3><p class="text-xs text-slate-500">${escapeHtml(w.profile.specialty||'Service provider')} · ${escapeHtml(w.city)}</p></div></div><label class="text-xs"><input type="checkbox" data-compare="${w.id}"> Compare</label></div><p class="mt-3 text-sm text-slate-600">${escapeHtml(w.profile.bio||'Local service professional')}</p><div class="mt-3 flex flex-wrap gap-2 text-xs"><span class="rounded-lg bg-blue-50 px-2 py-1">INR ${Number(w.profile.rate||0)} / ${w.profile.rateType==='flat'?'job':'hr'}</span><span class="rounded-lg bg-slate-100 px-2 py-1">${(w.profile.portfolio||[]).length} portfolio photos</span><span class="rounded-lg bg-slate-100 px-2 py-1">${escapeHtml(w.profile.e       list.querySelectorAll('.pro-card').forEach(card=>card.onclick=e=>{if(e.target.closest('.fav-btn,.pro-card a,.pro-card button'))return;selectProfessional(card.dataset.pro)});
      list.querySelectorAll('.fav-btn').forEach(button=>button.onclick=e=>{e.stopPropagation();toggleFavorite(button.dataset.fav)});
      list.querySelectorAll('[data-contact]').forEach(link=>link.onclick=e=>e.stopPropagation());
      list.querySelectorAll('[data-route]').forEach(button=>button.onclick=e=>{e.stopPropagation();const person=professionals.find(pro=>pro.id===button.dataset.route);if(person)startRoute(person)});
    }
    function filterList(){clearTimeout(searchDebounce);searchDebounce=setTimeout(()=>searchProfessionals(document.getElementById('search-input').value.trim()),350)}
    function renderMarkers(){if(!map||!window.google?.maps)return;markers.forEach(item=>item.marker.setMap(null));markers=[];professionals.forEach(person=>{const marker=new google.maps.Marker({map,position:{lat:person.coords[0],lng:person.coords[1]},title:person.name,label:{text:categoryIcons[person.category],color:'#fff',fontWeight:'700',fontSize:'12px'},icon:{path:google.maps.SymbolPath.CIRCLE,fillColor:'#2563eb',fillOpacity:1,scale:16,strokeColor:'#fff',strokeWeight:3}});const info=new google.maps.InfoWindow({content:`<div style="min-width:150px"><strong>${escapeHtml(person.name)}</strong><div style="margin-top:3px;color:#64748b;font-size:11px">${escapeHtml(person.specialty)} - ${person.distance} km</div></div>`});marker.addListener('click',()=>{info.open({map,anchor:marker});selectProfessional(person.id)});markers.push({id:person.id,marker})})}
    function focusMarker(id){const item=markers.find(entry=>entry.id===id),person=professionals.find(entry=>entry.id===id);if(item&&map){map.panTo({lat:person.coords[0],lng:person.coords[1]});map.setZoom(15)}}
    function selectProfessional(id){const p=professionals.find(person=>person.id===id);if(!p)return;selectedId=id;renderList();const box=document.getElementById('detail-overlay');box.className='pointer-events-auto fixed inset-0 z-[1200]';box.innerHTML=`<button id="detail-backdrop" class="absolute inset-0 bg-slate-950/25 backdrop-blur-[2px]" aria-label="Close profile"></button><aside class="enter absolute inset-x-0 bottom-0 flex max-h-[88dvh] min-w-0 flex-col overflow-y-auto overscroll-contain rounded-t-[28px] bg-white shadow-2xl sm:inset-y-4 sm:bottom-auto sm:left-auto sm:right-4 sm:h-[calc(100dvh-2rem)] sm:max-h-none sm:w-[min(420px,calc(100vw-2rem))] sm:rounded-[28px]"><div class="relative h-44 shrink-0 overflow-hidden bg-gradient-to-br from-blue-600 via-indigo-600 to-violet-700"><div class="absolute -right-8 -top-16 h-52 w-52 rounded-full border border-white/20"></div><div class="absolute right-14 top-10 h-28 w-28 rounded-full border border-white/15"></div><button id="detail-close" class="absolute right-4 top-4 grid h-9 w-9 place-items-center rounded-full bg-white/15 text-white backdrop-blur hover:bg-white/25" aria-label="Close">X</button><div class="absolute left-5 top-1/2 flex -translate-y-1/2 items-center gap-3"><span class="grid h-[68px] w-[68px] shrink-0 place-items-center rounded-[22px] border-4 border-white bg-blue-100 text-xl font-extrabold text-blue-700 shadow-md">${p.initials}</span><span class="rounded-lg bg-white/15 px-2.5 py-1.5 text-[10px] font-bold uppercase tracking-wider text-white backdrop-blur">${escapeHtml(p.category)} · Google Places listing</span></div></div><div class="px-5 pb-5"><div class="flex justify-end pt-4"><button id="detail-fav" class="flex h-9 items-center gap-2 rounded-full border border-slate-200 px-3 text-xs font-bold text-slate-600 hover:border-rose-200 hover:text-rose-500">${db.favorites.includes(p.id)?'Saved':'Save'}</button></div><h2 class="mt-3 text-2xl font-extrabold tracking-tight text-slate-900">${escapeHtml(p.name)}</h2><p class="mt-1 text-sm text-slate-500">${escapeHtml(p.specialty)}</p><div class="mt-4 flex flex-wrap gap-2"><span class="rounded-lg bg-amber-50 px-2.5 py-1.5 text-xs font-bold text-amber-700">Rating ${p.rating} (${p.reviews ? `${p.reviews} reviews` : 'No reviews yet'})</span><span class="rounded-lg bg-blue-50 px-2.5 py-1.5 text-xs font-bold text-blue-700">${p.distance} km away</span><span class="rounded-lg bg-emerald-50 px-2.5 py-1.5 text-xs font-bold text-emerald-700">${p.available===null?'Confirm availability when booking':p.available?'Available today':'Available tomorrow'}</span></div><div class="my-5 grid grid-cols-2 gap-3"><div class="rounded-2xl bg-slate-50 p-3.5"><p class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Price</p><p class="mt-1 text-lg font-extrabold text-slate-900">${escapeHtml(p.price||'Standard consultation')}</p></div><div class="rounded-2xl bg-slate-50 p-3.5"><p class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Listing</p><p class="mt-1 text-lg font-extrabold text-slate-900">Google Places</p></div></div><div class="space-y-3 rounded-2xl border border-slate-100 p-4"><div><p class="text-xs font-bold text-slate-800">Education & credentials</p><p class="mt-1.5 text-xs leading-5 text-slate-500">${escapeHtml(p.education||'Professional credentials available on request')}</p></div><div class="border-t border-slate-100 pt-3"><p class="text-xs font-bold text-slate-800">Contact</p><p class="mt-1.5 text-sm font-semibold text-blue-700">${p.phone?escapeHtml(p.phone):'Contact details not provided'}</p><p class="mt-1 text-[10px] text-slate-400">Contact information is shown when listed on Google Maps.</p></div><p class="border-t border-slate-100 pt-3 text-xs leading-5 text-slate-500">Serving ${escapeHtml(locationLabel(currentUser))}. Listing and business contact details are supplied by Google Places. Professional qualifications are not verified by this listing.</p></div><button id="book-appointment" class="mt-4 flex w-full items-center justify-center gap-2 rounded-xl bg-blue-600 py-3.5 text-sm font-extrabold text-white shadow-lg shadow-blue-600/20 transition hover:bg-blue-700 active:scale-[.99]">Book Appointment <span class="text-lg">→</span></button><button id="route-button" class="mt-2 flex w-full items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white py-3 text-sm font-bold text-slate-700 transition hover:border-blue-300 hover:text-blue-700"><span>Get driving route</span></button><p class="mt-3 text-center text-[10px] text-slate-400">Route from your location using Google Maps Routes</p></div></aside><div id="booking-overlay" class="fixed inset-0 z-[1300] hidden items-center justify-center bg-slate-950/35 p-4 backdrop-blur-sm"><section class="enter w-full max-w-sm rounded-3xl border border-slate-100 bg-white p-5 shadow-2xl"><div class="flex items-start justify-between gap-3"><div><p class="text-xs font-bold uppercase tracking-wider text-blue-600">Appointment request</p><h3 class="mt-1 text-xl font-extrabold text-slate-900">Choose a time</h3></div><button id="booking-close" class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200" aria-label="Close booking form">×</button></div><p class="mt-2 text-sm text-slate-500">Select a preferred time with ${escapeHtml(p.name)}. This is a booking prototype.</p><label class="mt-4 block text-xs font-bold text-slate-700">Service address<input id="service-address" type="text" maxlength="500" required value="${escapeHtml(currentUser.address||currentUser.city||'')}" placeholder="Street, area, city" class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm outline-none focus:border-blue-500"></label><label class="mt-5 block text-xs font-bold text-slate-700">Date<input id="booking-date" type="date" min="${tomorrowDate()}" value="${tomorrowDate()}" class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"></label><label class="mt-4 block text-xs font-bold text-slate-700">Preferred time<select id="booking-time" class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"><option>10:00 AM</option><option>11:00 AM</option><option>1:00 PM</option><option>2:30 PM</option><option>4:00 PM</option></select></label><button id="booking-confirm" class="mt-5 w-full rounded-xl bg-blue-600 py-3.5 text-sm font-extrabold text-white shadow-lg shadow-blue-600/20 transition hover:bg-blue-700">Confirm Booking</button></section></div>`;document.getElementById('detail-close').onclick=closeDetail;document.getElementById('detail-backdrop').onclick=closeDetail;document.getElementById('detail-fav').onclick=()=>{toggleFavorite(p.id);const favoriteButton=document.getElementById('detail-fav');if(favoriteButton)favoriteButton.innerHTML=db.favorites.includes(p.id)?'Saved':'Save'};document.getElementById('route-button').onclick=()=>startRoute(p);document.getElementById('book-appointment').onclick=()=>{const overlay=document.getElementById('booking-overlay');overlay.classList.remove('hidden');overlay.classList.add('flex')};document.getElementById('booking-close').onclick=closeBooking;document.getElementById('booking-overlay').onclick=e=>{if(e.target.id==='booking-overlay')closeBooking()};document.getElementById('booking-confirm').onclick=()=>confirmBooking(p);focusMarker(id)}
    function tomorrowDate(){const date=new Date();date.setDate(date.getDate()+1);return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0')}
    function closeBooking(){const overlay=document.getElementById('booking-overlay');if(overlay){const wasConfirmed=Boolean(document.getElementById('booking-done'));overlay.classList.add('hidden');overlay.classList.remove('flex');if(wasConfirmed&&selectedId)selectProfessional(selectedId)}}
    async function confirmBooking(person){const dateInput=document.getElementById('booking-date'),timeInput=document.getElementById('booking-time'),confirmButton=document.getElementById('booking-confirm');const date=dateInput?.value,time=timeInput?.value,serviceAddress=document.getElementById('service-address')?.value.trim();if(!serviceAddress){toast('Enter the service address.','error');return}if(!date||!time){toast('Choose a date and time to continue.','error');return}const originalLabel=confirmButton?.textContent||'Confirm Booking';if(confirmButton){confirmButton.disabled=true;confirmButton.textContent='Sending request...';confirmButton.classList.add('opacity-70','cursor-wait')}try{const response=await fetch('/api/book-appointment',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(db.authToken||'')},body:JSON.stringify({date,time,serviceAddress:document.getElementById('service-address')?.value||'',professional:{name:person.name,category:person.category,specialty:person.specialty,phone:person.phone||'',address:person.address||''}})});const result=await response.json().catch(()=>({}));if(!response.ok||!result.success)throw new Error(result.message||'Could not send the appointment request. Please try again.');db.bookings.push({id:result.appointment?.id,professionalId:person.id,professionalName:person.name,category:person.category,customerEmail:currentUser.email,date,time,createdAt:new Date().toISOString(),status:'pending'});saveStore();const overlay=document.getElementById('booking-overlay');overlay.innerHTML='<section class="enter w-full max-w-sm rounded-3xl border border-emerald-100 bg-white p-7 text-center shadow-2xl"><span class="mx-auto grid h-14 w-14 place-items-center rounded-full bg-emerald-50 text-2xl font-bold text-emerald-600">&check;</span><h3 class="mt-4 text-xl font-extrabold text-slate-900">Request sent</h3><p class="mt-2 text-sm leading-6 text-slate-500">Your request with '+escapeHtml(person.name)+' for '+escapeHtml(date)+' at '+escapeHtml(time)+' was sent. You will receive an email when it is accepted.</p><button id="booking-done" class="mt-5 w-full rounded-xl bg-blue-600 py-3 text-sm font-extrabold text-white hover:bg-blue-700">Done</button></section>';document.getElementById('booking-done').onclick=closeBooking;toast('Appointment request sent for acceptance.','success')}catch(error){toast(error.message||'Could not send the appointment request.','error');if(confirmButton){confirmButton.disabled=false;confirmButton.textContent=originalLabel;confirmButton.classList.remove('opacity-70','cursor-wait')}}}        function closeDetail(){const box=document.getElementById('detail-overlay');if(!box)return;box.className='pointer-events-none fixed inset-0 z-[1200]';box.innerHTML='';selectedId=null;renderList()}
    async function startRoute(person){if(!map){toast('Google Maps is still loading. Please try again shortly.','info');return}const start=homeCoords();try{const response=await fetch('/api/routes',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${db.authToken||''}`},body:JSON.stringify({origin:{lat:start[0],lng:start[1]},destination:{lat:person.coords[0],lng:person.coords[1]}})});const result=await response.json();if(!response.ok)throw new Error(result.message||'Unable to calculate route.');if(routeLine)routeLine.setMap(null);const path=google.maps.geometry.encoding.decodePath(result.route.encodedPolyline);routeLine=new google.maps.Polyline({path,geodesic:true,strokeColor:'#2563eb',strokeOpacity:.95,strokeWeight:6,map});const bounds=new google.maps.LatLngBounds();path.forEach(point=>bounds.extend(point));map.fitBounds(bounds,72);const km=(result.route.distanceMeters/1000).toFixed(1);toast(`Driving route ready: ${km} km to ${person.name}.`);const routeButton=document.getElementById('route-button');if(routeButton)routeButton.querySelector('span').textContent=`Route ready - ${km} km`}catch(error){toast(error.message||'Route calculation failed.','error')}}
    function toggleFavorite(id){const i=db.favorites.indexOf(id);if(i>=0){db.favorites.splice(i,1);toast('Removed from your saved professionals.','info')}else{db.favorites.push(id);toast('Professional saved to your favorites.')}saveStore();queueCloudPreferenceSync({favorites:[...db.favorites]});renderList()}
    function exportData(){const payload={product:'WorkSmith',exportedAt:new Date().toISOString(),account:{name:currentUser.name,email:currentUser.email,homeLocation:currentUser.city,createdAt:currentUser.createdAt},applicationState:{favorites:db.favorites,searchHistory:db.searches,bookings:db.bookings,session:db.session}};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='auth_config.json';document.body.append(a);a.click();a.remove();URL.revokeObjectURL(url);document.getElementById('profile-menu').classList.add('hidden');toast('Your data export is ready.','info')}
    function detectLocation(onSuccess){if(!navigator.geolocation){toast('This browser does not support location detection.','error');return}toast('Requesting your location permission…','info');navigator.geolocation.getCurrentPosition(position=>onSuccess([position.coords.latitude,position.coords.longitude]),error=>{const messages={1:'Location permission was denied. You can allow it in your browser settings.',2:'Your current location could not be determined.',3:'Location request timed out. Please try again.'};toast(messages[error.code]||'Unable to detect your location.','error')},{enableHighAccuracy:true,timeout:15000,maximumAge:60000})}
    async function applyDetectedLocation(coords,statusId){try{const response=await fetch('/api/me/location',{method:'PATCH',headers:{'Content-Type':'application/json','Authorization':`Bearer ${db.authToken||''}`},body:JSON.stringify({city:currentUser.city,coords})});const result=await response.json();if(!response.ok)throw new Error(result.message||'Could not save GPS location.');currentUser=result.user;saveStore();const status=document.getElementById(statusId);if(status)status.textContent=`GPS ready: ${coords[0].toFixed(4)}, ${coords[1].toFixed(4)}`;if(map){map.setCenter({lat:coords[0],lng:coords[1]});map.setZoom(14);if(homeMarker)homeMarker.setPosition({lat:coords[0],lng:coords[1]});if(routeLine){routeLine.setMap(null);routeLine=null}searchProfessionals(document.getElementById('search-input')?.value.trim()||'')}toast('Map and nearby professionals updated to your GPS location.')}catch(error){toast(error.message||'Could not save the detected location.','error')}}
    function openLocationModal(){document.getElementById('location-modal').classList.remove('hidden');document.getElementById('location-modal').classList.add('flex')}
    function closeLocationModal(){const modal=document.getElementById('location-modal');modal.classList.add('hidden');modal.classList.remove('flex')}
    async function saveLocation(){const city=document.getElementById('location-select').value;if(city===currentUser.city&&!currentUser.coords){closeLocationModal();return}try{const response=await fetch('/api/me/location',{method:'PATCH',headers:{'Content-Type':'application/json','Authorization':`Bearer ${db.authToken||''}`},body:JSON.stringify({city})});const result=await response.json();if(!response.ok)throw new Error(result.message||'Could not update home location.');currentUser=result.user;saveStore();activeCategory='Doctor';closeLocationModal();toast(`Location updated to ${city}.`);renderDashboard()}catch(error){toast(error.message||'Could not update home location.','error')}}
    // Restore an authenticated session from the simulated backend.
    async function initialize(){if(db.authToken){try{const response=await fetch('/api/me',{headers:{'Authorization':`Bearer ${db.authToken}`}});const result=await response.json();if(!response.ok)throw new Error('Session expired.');currentUser=result.user;db.session=currentUser.email;saveStore();await loadCloudProfile();renderDashboard();return}catch{db.authToken=null;db.session=null;saveStore()}}else{db.session=null;saveStore()}renderAuth('login')}initialize();
  })();
